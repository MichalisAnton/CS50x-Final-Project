{% extends "layout.html" %}

{% block title %}
    Lobby
{% endblock %}

{% block main %}
    <div class="container py-1">
        <h1 class="mb-4 text-center">Lobby</h1>
        <h6 class="text-center">Room Name: {{ room.room_name  }}<br>Room Code: {{ room.room_code  }} <br> Host: {{ host.name  }}</h6>
    </div>
    {% if is_host %}
        <div id="host-controls" class="text-center mb-4">
            Waiting for players to join
            <div class="spinner-border spinner-border-sm" role="status">
                <span class="sr-only"></span>
            </div>
        </div>
    {% else %}
        <div id="quest-message" class="text-center mb-4">
            Waiting for players to join
            <div class="spinner-border spinner-border-sm" role="status">
                <span class="sr-only"></span>
            </div>
        </div>
    {% endif %}
    <div id="player-list" class="row g-4">
    <!-- players will appear here -->
    </div>
    <script>
        function drawCards(name, player_id) {
            const card = document.createElement("div")
            card.id = player_id
            card.className = "col-4"
            card.innerHTML = `<div class="room-action-btn action-btn d-flex align-items-center justify-content-center">${name}</div>`
            return card
        }
        setInterval(() => {
            fetch("/lobby-state")
                .then(response => response.json())
                .then(data => {
                // Handle error response (e.g. host left and room was deleted)
                    if (data.error) {
                        window.location.href = "/rooms";
                        return;
                    }
                // Poll for the rest of players, if the leader chose to change the status of the session
                    if (data.status === "In Session") {
                        window.location.href = "/game"
                    }
                // Leader button to start the game if the session has 4 players, unless the button is already there
                    const hostControls = document.getElementById("host-controls")
                    if (hostControls && data.players.length >= 4 && !hostControls.querySelector("button")) {
                        hostControls.innerHTML = `<form method="POST" action="/start-game">
                        <button class="btn action-btn play-btn" type="submit">Start Game!</button>
                        </form>`
                    }
                // Sync lobby cards by player id so swaps with the same player count still update correctly
                    const playerList = document.getElementById("player-list")
                    const existingCards = Array.from(playerList.children)
                    const existingIds = new Set(existingCards.map(card => String(card.id)))
                    const serverIds = new Set(data.players.map(player => String(player.id)))

                // Remove cards for players who left
                    for (const card of existingCards) {
                        if (!serverIds.has(String(card.id))) {
                            card.remove()
                        }
                    }

                // Add cards only for new players
                    for (const player of data.players) {
                        if (!existingIds.has(String(player.id))) {
                            playerList.appendChild(drawCards(player.name, player.id))
                        }
                    }
                })
        }, 2000)
    </script>
{% endblock %}
